[project]
name = "convicts-to-work-backend"
version = "0.1.0"
description = "Digital workflow for employment applications and contracts"
requires-python = ">=3.14,<3.15"
dependencies = [
  "celery[redis]>=5.6,<5.7",
  "django>=5.2,<5.3",
  "django-storages[s3]>=1.14,<1.15",
  "djangorestframework>=3.16,<3.17",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pypdf>=5,<8",
  "psycopg[binary]>=3.2,<3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-django>=4.10,<5",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]
