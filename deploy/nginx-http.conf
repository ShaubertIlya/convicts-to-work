server {
    listen 80;
    listen [::]:80;
    server_name enbek.greymattergroup.org;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/enbek/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Until the certificate is issued, do not expose authentication over HTTP.
    location / {
        return 503;
    }
}
