server {
    listen 80;
    listen [::]:80;
    server_name enbek.greymattergroup.org;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/enbek/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name enbek.greymattergroup.org;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/enbek.greymattergroup.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enbek.greymattergroup.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /media/ {
        alias /opt/enbek/app/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:3180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
