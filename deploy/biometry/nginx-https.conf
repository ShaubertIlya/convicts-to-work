server {
    listen 80;
    listen [::]:80;
    server_name biometry.greymattergroup.org;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/biometry/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name biometry.greymattergroup.org;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/biometry.greymattergroup.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biometry.greymattergroup.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # These methods are for Enbek's server-to-server connection only.
    location = /api/v1/verification/start { return 403; }
    location ~ ^/api/v1/verification/[^/]+/consume/?$ { return 403; }
    location ^~ /api/v1/reference/ { return 403; }
    location = /api/v1/face/compare { return 403; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # The upstream release builds an HTTP Location. The browser only sees
        # the HTTPS callback, without sending state through a public HTTP hop.
        proxy_redirect http://enbek.greymattergroup.org/biometry/callback https://enbek.greymattergroup.org/biometry/callback;
    }
}
