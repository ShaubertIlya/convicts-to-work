services:
  biometry:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      BIOMETRY_VERIFICATION_TTL_SECONDS: "120"
      BIOMETRY_TERMINAL_RETENTION_SECONDS: "300"
      # The current upstream release accepts HTTP callback URLs only.
      # The public HTTPS reverse proxy rewrites this exact redirect to HTTPS.
      BIOMETRY_CALLBACK_URL: http://enbek.greymattergroup.org/biometry/callback
    ports:
      - "127.0.0.1:8180:8100"
    networks:
      enbek_integration:
        aliases:
          - biometry
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/ready', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3

networks:
  enbek_integration:
    external: true
    name: enbek_default
