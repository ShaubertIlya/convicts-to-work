server {
    listen 80;
    listen [::]:80;
    server_name biometry.greymattergroup.org;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/biometry/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # A camera flow and reference images must never be sent over HTTP.
    location / {
        return 503;
    }
}
